# opentmf-outbox-service — the /ops/outbox wire contract, as ONE OpenAPI fragment.
#
# WHY THIS FILE EXISTS (2026-09-08): every consumer serves the library's ops controller
# under its own context root and documents it in its own hand-maintained OAS. Four
# services were found describing the same surface four different ways — none with the
# TMF630 paging that the toolkit actually answers (206, the range headers, 416). This
# fragment is the ONE description; a consumer pastes the `paths` under its own `paths`
# and the `components` under its own `components`, keeps the names, and may pin itself
# to it with a drift test (README "OAS fragment"). The paging was MEASURED against
# tmf630-toolkit 3.1.1 and is PINNED by OutboxRoundTripIT against the toolkit the library
# builds with (3.5.1 in 1.7.0) — the numbers below are the toolkit's rules, not aspirations:
#
#   status  200  total == 0, or offset == 0 and every row fit in the page
#           206  otherwise (offset > 0, or fewer rows than the total in this page)
#           416  total > 0 and offset >= total; a total of 0 is NEVER a 416
#           400  limit <= 0 or non-numeric, an unknown FILTER field, an unknown state leg
#                (the toolkit's own Tmf630Error; the state leg is the consumer's problem)
#   limit   default = paging.default-limit (library default 50); a value ABOVE
#           paging.max-limit (library default 500) is CLAMPED to it, not rejected
#   headers X-Total-Count, X-Result-Count and Content-Range on 200, 206 and 416;
#           Content-Range is 1-BASED ("items 1-50/281", "items */281" on 416, "items */0"
#           when empty); Link (first/prev/next/last) on 200 and 206
#   body    a BARE JSON array of rows on 200/206 (never PageImpl JSON); the toolkit's own
#           error object on its 400/416 — NOT the consumer's RFC 9457 problem (see Tmf630Error)
#
# Every error the CONSUMER renders is documented too (1.7.0), so a verbatim paste is complete:
#   - the library's own refusals (Spring ErrorResponses: 404, 409, the state leg's and the bulk
#     unpark's 400) and Spring's binding refusals carry `OutboxProblem` as application/problem+json
#     — what Spring's RFC 9457 rendering writes (MEASURED by OutboxOpsProblemDetailsIT with
#     Boot's spring.mvc.problemdetails.enabled=true, and by OutboxOpsWireConformanceTests);
#   - every operation names the answers the consumer's security and web layer give before it
#     runs — 401, 403, 405, 406, 503, and 415 where a JSON body is read — by $ref to the
#     outboxUnauthorized … outboxServiceUnavailable response components.
# REFINABLE BY NAME — every error the paths name is a $ref to a component carrying
# `x-opentmf-refinable`, so the pasted PATHS stay verbatim for every consumer:
#   `true`    — the consumer's own answers (those six responses and the OutboxProblem schema).
#               A consumer may REDEFINE the component under the SAME name: its wording, its
#               headers, its problem schema (for example
#               `OutboxProblem: { $ref: '#/components/schemas/ProblemDetail' }`).
#   `content` (1.8.0) — the library's refusals, which the consumer RENDERS: the 400s, 404, 409s
#               and 416. Their `description` and `headers` are the library's and stay verbatim;
#               their `content` is the consumer's error rendering — it may replace the media
#               types and schemas (a consumer that answers every error as `application/json` in
#               its own error shape writes exactly that). The content shipped here is the
#               default: Spring's RFC 9457 rendering and the toolkit's own Tmf630Error.
# Everything unmarked (parameters, request bodies, 2xx, headers, the other schemas) is the
# library's and is pasted verbatim.
#
# Paths are relative to the consumer's server URL (the library mounts under /ops on the
# main port); the consumer's deny-by-default security gates them as admin-class.
openapi: 3.1.0
info:
  title: opentmf-outbox-service /ops/outbox fragment
  version: 1.8.0
  description: >-
    Paste-in contract for the outbox ops surface served by opentmf-outbox-service.
    Not a standalone API document — a fragment the consumer's OAS absorbs. The library's
    meters are not part of this REST surface: opentmf.outbox.pending, parked, in-flight,
    relay-lag (gauges by lane, since 1.4.0) and metrics-age (gauge), relayed, dropped and
    attempts (README "Metrics") — alert on parked > 0 and on metrics-age above a few refresh
    periods.

paths:
  /ops/outbox:
    get:
      operationId: listOutboxRows
      summary: Outbox triage list (TMF630 attribute filtering + paging, payloads omitted)
      description: >-
        TMF630 attribute filtering over the row fields (aggregateType, aggregateId,
        eventType, destination, clientProfile, reference, createdOn ranges; the state legs
        via `relayedOn` / `cancelledOn` / `parkedOn` null-filters) with the toolkit's
        offset/limit paging — an unknown filter field is a strict 400. Payloads ride only
        the single-row inspect. `state` (since 1.4.0) narrows the list to one derived-state
        leg exactly as the path sibling `/ops/outbox/state/{state}` does; it is the one
        non-filter name this operation accepts (`state.eq` and the like are still filter keys,
        and a 400).
      parameters:
        - name: state
          in: query
          required: false
          description: >-
            One derived-state leg: `pending`, `parked`, `relayed`, `cancelled`; an unknown
            value is a 400. Absent = every row.
          schema: { type: string, enum: [pending, parked, relayed, cancelled] }
        - $ref: '#/components/parameters/outboxOffset'
        - $ref: '#/components/parameters/outboxLimit'
      responses:
        '200': { $ref: '#/components/responses/outboxPage' }
        '206': { $ref: '#/components/responses/outboxPartialPage' }
        '400': { $ref: '#/components/responses/outboxBadRequest' }
        '401': { $ref: '#/components/responses/outboxUnauthorized' }
        '403': { $ref: '#/components/responses/outboxForbidden' }
        '405': { $ref: '#/components/responses/outboxMethodNotAllowed' }
        '406': { $ref: '#/components/responses/outboxNotAcceptable' }
        '416': { $ref: '#/components/responses/outboxRangeNotSatisfiable' }
        '503': { $ref: '#/components/responses/outboxServiceUnavailable' }

  /ops/outbox/state/{state}:
    get:
      operationId: listOutboxRowsByState
      summary: The list narrowed to ONE derived-state leg
      description: >-
        `pending` (not relayed, not cancelled — parked, held and in-flight rows included),
        `parked`, `relayed`, `cancelled` — the closed set; an unknown value is a 400. A row
        cancelled after its lease lapsed mid-send and then delivered (sent-but-cancelled) is
        listed under both `relayed` and `cancelled`. The same TMF630 filters and paging apply
        on top. The same as `GET /ops/outbox?state=` (1.4.0); the path form came first and
        stays.
      parameters:
        - name: state
          in: path
          required: true
          schema: { type: string, enum: [pending, parked, relayed, cancelled] }
        - $ref: '#/components/parameters/outboxOffset'
        - $ref: '#/components/parameters/outboxLimit'
      responses:
        '200': { $ref: '#/components/responses/outboxPage' }
        '206': { $ref: '#/components/responses/outboxPartialPage' }
        '400': { $ref: '#/components/responses/outboxBadRequest' }
        '401': { $ref: '#/components/responses/outboxUnauthorized' }
        '403': { $ref: '#/components/responses/outboxForbidden' }
        '405': { $ref: '#/components/responses/outboxMethodNotAllowed' }
        '406': { $ref: '#/components/responses/outboxNotAcceptable' }
        '416': { $ref: '#/components/responses/outboxRangeNotSatisfiable' }
        '503': { $ref: '#/components/responses/outboxServiceUnavailable' }

  /ops/outbox/parked:
    get:
      operationId: listParkedOutboxRows
      summary: The parked rows — runbook alias of /ops/outbox/state/parked (one code path)
      description: >-
        Parked = exhausted its publisher's attempt budget with the PARK outcome
        (`parkedOn` stamped). The break-glass unpark takes the ids this names.
      parameters:
        - $ref: '#/components/parameters/outboxOffset'
        - $ref: '#/components/parameters/outboxLimit'
      responses:
        '200': { $ref: '#/components/responses/outboxPage' }
        '206': { $ref: '#/components/responses/outboxPartialPage' }
        '400': { $ref: '#/components/responses/outboxBadRequest' }
        '401': { $ref: '#/components/responses/outboxUnauthorized' }
        '403': { $ref: '#/components/responses/outboxForbidden' }
        '405': { $ref: '#/components/responses/outboxMethodNotAllowed' }
        '406': { $ref: '#/components/responses/outboxNotAcceptable' }
        '416': { $ref: '#/components/responses/outboxRangeNotSatisfiable' }
        '503': { $ref: '#/components/responses/outboxServiceUnavailable' }

  /ops/outbox/{id}:
    get:
      operationId: inspectOutboxRow
      summary: One row in full (payload + lastError — the pre-unpark forensic read)
      parameters:
        - $ref: '#/components/parameters/outboxRowId'
      responses:
        '200':
          description: The row, payload included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboxRow' }
        '400': { $ref: '#/components/responses/outboxInspectBadRequest' }
        '401': { $ref: '#/components/responses/outboxUnauthorized' }
        '403': { $ref: '#/components/responses/outboxForbidden' }
        '404': { $ref: '#/components/responses/outboxRowNotFound' }
        '405': { $ref: '#/components/responses/outboxMethodNotAllowed' }
        '406': { $ref: '#/components/responses/outboxNotAcceptable' }
        '503': { $ref: '#/components/responses/outboxServiceUnavailable' }

  /ops/outbox/{id}/unpark:
    post:
      operationId: unparkOutboxRow
      summary: Unpark one parked row (operator break-glass, never automatic)
      description: >-
        Clears `parkedOn`, resets attempts, makes the row due now and nudges the relay after
        commit. Use only after the root cause of the parking is fixed.
      parameters:
        - $ref: '#/components/parameters/outboxRowId'
      responses:
        '200':
          description: Acknowledgement — `action` is `unparked`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboxOpsAck' }
        '400': { $ref: '#/components/responses/outboxRowIdOutOfRange' }
        '401': { $ref: '#/components/responses/outboxUnauthorized' }
        '403': { $ref: '#/components/responses/outboxForbidden' }
        '404': { $ref: '#/components/responses/outboxRowNotFound' }
        '405': { $ref: '#/components/responses/outboxMethodNotAllowed' }
        '406': { $ref: '#/components/responses/outboxNotAcceptable' }
        '409': { $ref: '#/components/responses/outboxUnparkConflict' }
        '503': { $ref: '#/components/responses/outboxServiceUnavailable' }

  /ops/outbox/unpark:
    post:
      operationId: unparkOutboxRowsByFilter
      summary: Unpark by FILTER — every parked row of one destination (bounded; call again while more remain)
      description: >-
        For after a receiver's outage that outlasted its publisher's budget, once the receiver
        is back. Each matching row ends exactly as the single unpark leaves it (parkedOn
        cleared, attempts reset, due now, lastError kept), under the same guard; the resend
        stays bounded by the relay's lanes. Set-based in bounded batches: the call stops after
        `opentmf.outbox.maintenance.time-budget` and answers `moreToUnpark: true` — call again.
        `destination` is REQUIRED (there is no "unpark everything"). A row parked by a
        terminal answer (a refused body) comes back parked unless the cause was fixed. Gate it
        like the single unpark.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboxUnparkFilter' }
      responses:
        '200':
          description: How many rows were unparked, and whether more remain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboxUnparkReport' }
        '400': { $ref: '#/components/responses/outboxUnparkFilterBadRequest' }
        '401': { $ref: '#/components/responses/outboxUnauthorized' }
        '403': { $ref: '#/components/responses/outboxForbidden' }
        '405': { $ref: '#/components/responses/outboxMethodNotAllowed' }
        '406': { $ref: '#/components/responses/outboxNotAcceptable' }
        '415': { $ref: '#/components/responses/outboxUnsupportedMediaType' }
        '503': { $ref: '#/components/responses/outboxServiceUnavailable' }

  /ops/outbox/{id}/cancel:
    post:
      operationId: cancelOutboxRow
      summary: Withdraw one unreleased row — never relayed from now on, retained for audit
      description: >-
        A row IN FLIGHT — claimed by a relay under a live lease: queued for its send (about a
        second at most) or sending — is refused at once with a 409; it is cancellable once it
        is booked (a failed send in backoff is cancellable, a delivered one is relayed). A row whose lease has lapsed is
        cancellable; should its stale send still succeed, the row is booked
        sent-but-cancelled (both `relayedOn` and `cancelledOn` stamped).
      parameters:
        - $ref: '#/components/parameters/outboxRowId'
      responses:
        '200':
          description: Acknowledgement — `action` is `cancelled`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboxOpsAck' }
        '400': { $ref: '#/components/responses/outboxRowIdOutOfRange' }
        '401': { $ref: '#/components/responses/outboxUnauthorized' }
        '403': { $ref: '#/components/responses/outboxForbidden' }
        '404': { $ref: '#/components/responses/outboxRowNotFound' }
        '405': { $ref: '#/components/responses/outboxMethodNotAllowed' }
        '406': { $ref: '#/components/responses/outboxNotAcceptable' }
        '409': { $ref: '#/components/responses/outboxCancelConflict' }
        '503': { $ref: '#/components/responses/outboxServiceUnavailable' }

  /ops/outbox/maintenance/prune:
    post:
      operationId: pruneOutboxRows
      summary: One BOUNDED retention-pruning call over terminal (relayed + cancelled) rows
      description: >-
        Deletes relayed and cancelled rows past `opentmf.outbox.retention`, set-based in
        batches of `opentmf.outbox.maintenance.batch-size`, each its own transaction; the call
        stops after `opentmf.outbox.maintenance.time-budget` and answers `moreToPrune: true` —
        wire to a CronJob that calls again while it is true. Pending and parked rows are
        structurally never pruned. A consumer
        with its own wider prune (other tables) documents that one separately — this is the
        library's outbox-only pass, and it is live wherever the library's ops controller is.
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboxPruneReport' }
        '401': { $ref: '#/components/responses/outboxUnauthorized' }
        '403': { $ref: '#/components/responses/outboxForbidden' }
        '405': { $ref: '#/components/responses/outboxMethodNotAllowed' }
        '406': { $ref: '#/components/responses/outboxNotAcceptable' }
        '503': { $ref: '#/components/responses/outboxServiceUnavailable' }

components:
  parameters:
    outboxOffset:
      name: offset
      in: query
      description: Zero-based row offset (TMF630 paging). Default 0.
      schema: { type: integer, minimum: 0, default: 0 }
    outboxLimit:
      name: limit
      in: query
      description: >-
        Page size. Default = the consumer's `paging.default-limit` (library default 50);
        a value above `paging.max-limit` (library default 500) is CLAMPED to it, not
        rejected - so the schema declares no `maximum` (1.7.0: it said 500, which a
        black-box suite reads as "501 must be refused"); 0 or a negative value is a 400.
      schema: { type: integer, minimum: 1, default: 50 }
    outboxRowId:
      name: id
      in: path
      required: true
      description: >-
        The row id - digits only (1.7.0): the routes take `{id:\d+}`, so a segment that is not
        digits (`unpark`, `-1`) matches no row route and is a 404, never this parameter's 400.
      schema: { type: integer, format: int64, minimum: 0 }

  headers:
    X-Total-Count:
      description: Total matching rows across all pages.
      schema: { type: integer }
    X-Result-Count:
      description: Rows in THIS response (0 on 416).
      schema: { type: integer }
    Content-Range:
      description: >-
        1-based, RFC 7233 shaped with the unit `items`: `items 1-50/281`; `items */281` on
        416; `items */0` on an empty result.
      schema: { type: string }
    Link:
      description: >-
        RFC 8288 paging links — `first`, `prev` (when offset > 0), `next` (when more rows
        follow) and `last`, each an absolute URL carrying the caller's limit and the
        computed offset. Absent on 416.
      schema: { type: string }

  responses:
    outboxPage:
      description: >-
        The FULL result (TMF630): total 0, or offset 0 and every row fit in this page. Bare
        JSON array, payloads null.
      headers:
        X-Total-Count: { $ref: '#/components/headers/X-Total-Count' }
        X-Result-Count: { $ref: '#/components/headers/X-Result-Count' }
        Content-Range: { $ref: '#/components/headers/Content-Range' }
        Link: { $ref: '#/components/headers/Link' }
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/OutboxRow' }
    outboxPartialPage:
      description: >-
        A PARTIAL page of a larger result (TMF630): offset > 0, or fewer rows than the total
        fit in this page. Same body and headers as 200 — clients page on X-Total-Count and
        Link.
      headers:
        X-Total-Count: { $ref: '#/components/headers/X-Total-Count' }
        X-Result-Count: { $ref: '#/components/headers/X-Result-Count' }
        Content-Range: { $ref: '#/components/headers/Content-Range' }
        Link: { $ref: '#/components/headers/Link' }
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/OutboxRow' }
    outboxRangeNotSatisfiable:
      x-opentmf-refinable: content
      description: >-
        offset >= total while total > 0. The range headers still ride (`items */<total>`,
        X-Result-Count 0); the body is the toolkit's error object (`code` "416"). An EMPTY
        result is never a 416 — it is a 200 with `items */0`.
      headers:
        X-Total-Count: { $ref: '#/components/headers/X-Total-Count' }
        X-Result-Count: { $ref: '#/components/headers/X-Result-Count' }
        Content-Range: { $ref: '#/components/headers/Content-Range' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Tmf630Error' }
    outboxBadRequest:
      x-opentmf-refinable: content
      description: >-
        A refused list request. The toolkit's own rejections — `limit` <= 0 or non-numeric
        (`reason` "Invalid sort or paging parameter."), an unknown attribute-filter field,
        and Spring's `page` / `size` where the consumer switched the toolkit's
        undeclared-query-parameter guard to REJECT (3.5.1, opt-in) — are rendered by the
        toolkit itself as `Tmf630Error`, unless the consumer's own error handling takes them
        first. An unknown state leg (`?state=` or `/state/{state}`) is the library's
        `ErrorResponse`, rendered by the consumer (`OutboxProblem` by default).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Tmf630Error' }
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxRowIdOutOfRange:
      x-opentmf-refinable: content
      description: >-
        The id is digits but beyond int64 (`9223372036854775808`): Spring's binding refuses it
        before the operation runs, rendered by the consumer.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxRowNotFound:
      x-opentmf-refinable: content
      description: >-
        No row with this id — the library's `ErrorResponse`, rendered by the consumer. An id
        that is not digits (`unpark`, `-1`) matches no row route (1.7.0) and is the consumer's
        404 for a path it does not map.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxInspectBadRequest:
      x-opentmf-refinable: content
      description: >-
        The id is digits but beyond int64 (Spring's binding refusal, rendered by the consumer)
        - or, where the consumer switched tmf630-toolkit's undeclared-query-parameter guard to
        REJECT (3.5.0, opt-in), a query parameter this route does not take (the toolkit's
        `Tmf630Error`, `reason` "Unknown query parameter.").
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Tmf630Error' }
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxUnparkConflict:
      x-opentmf-refinable: content
      description: >-
        The row is not parked (already relayed, cancelled, or still pending) - the library's
        `ErrorResponse`, rendered by the consumer.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxCancelConflict:
      x-opentmf-refinable: content
      description: >-
        The row is already relayed, already cancelled, or its send is in flight (a live lease;
        retry once it is booked) - the library's `ErrorResponse`, rendered by the consumer.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxUnparkFilterBadRequest:
      x-opentmf-refinable: content
      description: >-
        `destination` missing or blank, or a field of another JSON type than the schema's - the
        filter is typed strictly, never coerced (1.8.0): `false`, `0` or `1.5` for a string, a
        number for a date-time, a date-time without an offset (the library's `ErrorResponse`,
        naming the field); or a body that is not a JSON object (Spring's refusal) - rendered by
        the consumer.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }

    # The consumer's own answers, given before any operation runs (1.7.0). Each is REFINABLE BY
    # NAME (`x-opentmf-refinable`): the consumer may redefine it under the same name.
    outboxUnauthorized:
      x-opentmf-refinable: true
      description: >-
        No credentials, or credentials the consumer does not accept — answered by the consumer's
        security. The library's routes carry no security of their own: the consumer gates
        `/ops/outbox/**` as admin-class.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxForbidden:
      x-opentmf-refinable: true
      description: >-
        Authenticated, but not allowed the ops surface (the consumer's admin role) — answered by
        the consumer's security.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxMethodNotAllowed:
      x-opentmf-refinable: true
      description: >-
        The path exists but does not serve this method (`GET /ops/outbox/unpark`,
        `DELETE /ops/outbox/{id}`) — answered by the consumer's web layer. Spring MVC sends an
        `Allow` header naming the methods the path serves; a consumer that withholds it says so
        by refining this component.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxNotAcceptable:
      x-opentmf-refinable: true
      description: >-
        The `Accept` header admits none of the media types the operation produces
        (application/json; application/problem+json for a refusal) — Spring MVC refuses before
        the operation runs and writes the problem as application/problem+json although the
        caller did not ask for it (its fallback for a problem detail).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxUnsupportedMediaType:
      x-opentmf-refinable: true
      description: >-
        The request body's `Content-Type` is not application/json — Spring MVC refuses before
        the operation runs.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }
    outboxServiceUnavailable:
      x-opentmf-refinable: true
      description: >-
        The consumer cannot serve the call now and says so before the operation runs — for
        example, the identity provider's signing keys cannot be fetched, so no token can be
        verified. Retry later; a `Retry-After` header may say when. The library itself never
        answers 503.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OutboxProblem' }

  schemas:
    OutboxRow:
      type: object
      description: >-
        One outbox row as the ops surface serves it (`OutboxRowView`). `parked` and
        `inFlight` are the derived flags (`parkedOn` stamped; a live lease on a row not yet
        relayed); `payload` rides only the single-row inspect and is null in lists;
        `reference` is the consumer's private per-row note (never on the relay wire).
      properties:
        id: { type: integer, format: int64 }
        aggregateType: { type: string }
        aggregateId: { type: string }
        eventType: { type: string }
        destination: { type: string }
        clientProfile: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }
        attempts: { type: integer }
        parked: { type: boolean }
        inFlight:
          type: boolean
          description: A relay holds a live lease on the row and its send is not booked yet (1.3.0).
        createdOn: { type: string, format: date-time }
        nextAttemptOn:
          type: [string, 'null']
          format: date-time
          description: The earliest next attempt; while the row is in flight it reads as the lease end.
        releaseAt: { type: [string, 'null'], format: date-time }
        parkedOn: { type: [string, 'null'], format: date-time }
        claimedUntil:
          type: [string, 'null']
          format: date-time
          description: The relay's lease (1.3.0) - in the future while the row is in flight.
        relayedOn: { type: [string, 'null'], format: date-time }
        cancelledOn: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        payload: { type: [string, 'null'] }

    OutboxOpsAck:
      type: object
      description: What happened, to which row.
      properties:
        action: { type: string, enum: [unparked, cancelled] }
        id: { type: integer, format: int64 }

    OutboxPruneReport:
      type: object
      properties:
        outboxRowsPruned: { type: integer, format: int64 }
        moreToPrune:
          type: boolean
          description: The call stopped on its time budget with expired rows left - call again (1.3.0).

    OutboxUnparkFilter:
      type: object
      description: >-
        Typed strictly (1.8.0): each member takes exactly its schema's JSON type or null - no
        boolean or number is read as a string, no number as a date-time. Other members are
        ignored.
      required: [destination]
      properties:
        destination:
          type: string
          description: The receiver whose parked rows return to delivery - REQUIRED.
        parkedFrom:
          type: [string, 'null']
          format: date-time
          description: Inclusive lower bound of parkedOn; absent = no lower bound.
        parkedTo:
          type: [string, 'null']
          format: date-time
          description: Exclusive upper bound of parkedOn; absent = no upper bound.
        reference:
          type: [string, 'null']
          description: Only rows of this private correlation; absent = any.

    OutboxUnparkReport:
      type: object
      properties:
        outboxRowsUnparked: { type: integer, format: int64 }
        moreToUnpark:
          type: boolean
          description: The call stopped on its time budget with matching rows left - call again.

    Tmf630Error:
      type: object
      description: >-
        tmf630-toolkit's own error object — the shape it renders for its paging / filter
        rejections and for 416, independent of the consumer's RFC 9457 mapper.
      properties:
        code:
          type: string
          description: The HTTP status as a string ("400", "416").
        status:
          type: string
          description: The HTTP reason phrase.
        reason:
          type: string
          description: >-
            The category — "Invalid sort or paging parameter." or
            "Requested offset is outside the available range.".
        message:
          type: string
          description: The specific cause — "limit must be > 0", "Requested offset 999999 does not …".

    OutboxProblem:
      x-opentmf-refinable: true
      type: object
      description: >-
        The body of an answer the CONSUMER renders — the library's own refusals (Spring
        `ErrorResponse`s: 400, 404, 409), Spring's binding and transport refusals (400, 405,
        406, 415) and the consumer's security (401, 403, 503) — as an RFC 9457 problem
        detail, the shape Spring's problem-detail rendering writes (Boot's
        `spring.mvc.problemdetails.enabled=true`, or an advice extending
        `ResponseEntityExceptionHandler`). Other members are allowed. Generic on purpose: a
        consumer whose problem says more refines this schema UNDER THIS NAME (for example
        `OutboxProblem: { $ref: '#/components/schemas/ProblemDetail' }`) and the pasted paths
        stay verbatim. The toolkit's own 400/416 body is `Tmf630Error`, not this.
      properties:
        type:
          type: string
          format: uri-reference
          description: The problem type; `about:blank` when the status says it all.
        title: { type: string }
        status:
          type: integer
          description: The HTTP status, as a number (`Tmf630Error` carries it as a string).
        detail: { type: string }
        instance:
          type: string
          format: uri-reference
          description: The request path.
